name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: 'https://fake.example.com'
  PUBLIC_SUPABASE_ANON_KEY: 'fake_anon_key'
  # Required: src/lib/utils/thumbnailRenderer.ts imports it from $env/static/public,
  # so the build fails without a value at build time.
  PUBLIC_MAPBOX_ACCESS_TOKEN: 'pk.fake_ci_token'
  PRIVATE_SUPABASE_SERVICE_ROLE: 'fake_service_role'
  PRIVATE_STRIPE_WEBHOOK_SECRET: 'fake_webhook_secret'
  PRIVATE_STRIPE_API_KEY: 'fake_api_key'
  PUBLIC_SITE_NAME: 'AgSKAN Build Test'
  PUBLIC_VAPID_APPLICATION_SERVER_KEY: '[0,0,0,0]'
  PUBLIC_VAPID_KEY: '{"fake":"value"}'
  PRIVATE_VAPID_KEY: '{"fake":"value"}'
  PUBLIC_ONESIGNAL_APP_ID: 'fake_app_id'
  ONESIGNAL_REST_API_KEY: 'fake_rest_api_key'
  USER_AUTH_KEY: 'fake_auth_key'
  PRIVATE_KEY: '{"fake":"value"}'
  PUBLIC_KEY: 'fake_public_key'
  PRIVATE_SENDGRID_API_KEY: 'fake_sendgrid_key'
  PRIVATE_RESEND_API_KEY: 'fake_resend_key'
  PUBLIC_RESEND_AUDIENCE_ID: 'fake_audience_id'
  PUBLIC_APP_VERSION: '0.0.0'
  SUPABASE_PASS: 'fake_password'

jobs:
  build_and_test:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node >= 20 is required: @capacitor/cli declares engines.node >=20 and
      # .npmrc sets engine-strict=true, so an older Node fails during install.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # plotly.js pulls in style-loader, whose webpack peer is not needed to
      # consume plotly. Without this flag npm on Linux requires webpack in the
      # lockfile and the install aborts with "Missing: webpack from lock file".
      - name: NPM install
        run: npm ci --legacy-peer-deps

      - name: SvelteKit Build
        run: npm run build
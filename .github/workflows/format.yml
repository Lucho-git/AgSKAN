name: Format Check

on: [push]

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: 'https://fake_test_url.supabase.co'
  PUBLIC_SUPABASE_ANON_KEY: 'fake_anon_key'
  PRIVATE_SUPABASE_SERVICE_ROLE: 'fake_service_role'
  PRIVATE_STRIPE_API_KEY: 'fake_strip_api_key'
  PUBLIC_SITE_NAME: 'AgSKAN Build Test'

jobs:
  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: NPM install
        run: npm ci --legacy-peer-deps

      # Informational only: src/ is not Prettier-clean yet (443 files), so this
      # reports rather than blocks. Drop continue-on-error after running
      # "npm run format" and committing the result.
      - name: Check Code Format
        run: npm run format_check
        continue-on-error: true
<!-- tmp-default-pin-tint.html
     Standalone test for the "default-pin" tint mode: the default Mapbox pin's
     BODY recolours with the chosen colour but the middle white circle ALWAYS
     stays white. Mirrors markerTint.js tintMarkerCanvas(mode="default-pin"). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Default Pin Tint Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { font-size: 13px; color: #475569; margin: 0 0 18px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px;
          text-align: center; width: 140px; }
  .card canvas { display: block; margin: 0 auto 8px; }
  .card .label { font-size: 11px; color: #64748b; }
  .row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 22px; }
  .row .legend { font-size: 12px; color: #334155; font-weight: 600; width: 130px; }
</style>
</head>
<body>
  <h1>Default Pin — body recolours, white circle stays white</h1>
  <p>The original pin (top-left) and the same pin tinted with each colour via
     <code>default-pin</code> mode. The outer pin section takes the colour; the
     middle white circle never changes.</p>
  <div class="grid" id="grid"></div>

<script>
  const COLORS = {
    blue:   { label: "Blue",   light: "#bfdbfe", dark: "#3b82f6", deep: "#1d4ed8" },
    green:  { label: "Green",  light: "#bbf7d0", dark: "#22c55e", deep: "#15803d" },
    yellow: { label: "Yellow", light: "#fef08a", dark: "#eab308", deep: "#a16207" },
    amber:  { label: "Amber",  light: "#fde68a", dark: "#f59e0b", deep: "#b45309" },
    red:    { label: "Red",    light: "#fecaca", dark: "#ef4444", deep: "#b91c1c" },
    purple: { label: "Purple", light: "#e9d5ff", dark: "#a855f7", deep: "#7e22ce" },
    cyan:   { label: "Cyan",   light: "#a5f3fc", dark: "#06b6d4", deep: "#0e7490" },
    pink:   { label: "Pink",   light: "#fbcfe8", dark: "#ec4899", deep: "#be185d" },
    lime:   { label: "Lime",   light: "#d9f99d", dark: "#84cc16", deep: "#4d7c0f" },
  }

  function hexToRgb(hex) {
    const h = hex.replace("#", "")
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]
  }

  function tintPin(canvas, colorDef) {
    const ctx = canvas.getContext("2d")
    if (!ctx) return
    const { width, height } = canvas
    const imageData = ctx.getImageData(0, 0, width, height)
    const data = imageData.data
    const [br, bg, bb] = hexToRgb(colorDef.dark)
    const lerp = (a, b, x) => a + (b - a) * x
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3]
      if (a === 0) continue
      const lum = 0.299*r + 0.587*g + 0.114*b
      const dev = Math.max(Math.abs(r-g), Math.abs(g-b), Math.abs(r-b))
      const whiteT = Math.max(0, Math.min(1, (lum - 150) / 80)) *
                     (1 - Math.max(0, Math.min(1, (dev - 30) / 40)))
      data[i]   = lerp(br, 255, whiteT)
      data[i+1] = lerp(bg, 255, whiteT)
      data[i+2] = lerp(bb, 255, whiteT)
    }
    ctx.putImageData(imageData, 0, 0)
  }

  async function loadPin() {
    const img = new Image()
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = "/static/icons/mapbox-marker-3x.png" })
    const c = document.createElement("canvas")
    c.width = img.naturalWidth; c.height = img.naturalHeight
    const ctx = c.getContext("2d")
    ctx.drawImage(img, 0, 0)
    return c
  }

  function draw(canvas, src, colorDef) {
    const out = document.createElement("canvas")
    out.width = 105; out.height = 105
    const ctx = out.getContext("2d")
    ctx.drawImage(src, 0, 0)
    if (colorDef) tintPin(out, colorDef)
    // upscale for visibility
    const big = document.createElement("canvas")
    big.width = 105 * 2; big.height = 105 * 2
    big.getContext("2d").drawImage(out, 0, 0, big.width, big.height)
    canvas.appendChild(big)
  }

  async function main() {
    const grid = document.getElementById("grid")
    const src = await loadPin()

    // Original
    let card = document.createElement("div"); card.className = "card"
    let c = document.createElement("canvas")
    draw(c, src, null)
    card.appendChild(c)
    card.appendChild(Object.assign(document.createElement("div"), { className: "label", textContent: "Original" }))
    grid.appendChild(card)

    for (const [key, col] of Object.entries(COLORS)) {
      card = document.createElement("div"); card.className = "card"
      c = document.createElement("canvas")
      draw(c, src, col)
      card.appendChild(c)
      card.appendChild(Object.assign(document.createElement("div"), { className: "label", textContent: key }))
      grid.appendChild(card)
    }
  }

  main()
</script>
</body>
</html>
